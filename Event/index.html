<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Toukaitetudou</title>

	<!-- 全ページ共通CSS -->
	<link rel="stylesheet" href="/website/css/common.css">

	<!-- ページ専用CSS -->
	<link rel="stylesheet" href="/website/css/event.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

	<!-- =========================================================
         ヘッダー
         共通部分
         ========================================================= -->

	<header class="site-header">
	</header>


	<!-- =========================================================
         メイン
         ページ専用
         ========================================================= -->

	<main>
		<div class="breadcrumb">
			<a href="/website/">Home</a>
			<span>></span>
			<span>イベント</span>
		</div>
		<!-- =========================================
         ページヘッダー
         ========================================= -->
		<section class="event-header">
			<div class="content-width">

				<p class="section-label">EVENT</p>

				<h1>イベント</h1>

				<p>
					参加するイベントをご案内します。
				</p>

			</div>
		</section>


		<!-- =========================================
         今後の参加予定
         ========================================= -->
		<section class="upcoming-events">

			<div class="content-width">

				<div class="section-heading">
					<p class="section-label">UPCOMING</p>
					<h2>参加予定</h2>
				</div>


				<div class="event-grid">
					<!-- イベントカード -->
					<article class="event-card">

						<div class="event-card-image">
							<img id="noimage">
						</div>

						<div class="event-card-body">

							<p class="event-card-place">
								沼津高専
							</p>

							<h3>
								第61回高専祭
							</h3>

							<p>
								サークル参加としては初めてのイベントになります
							</p>

							<dl>
								<div>
									<dt>スペース</dt>
									<dd>専攻科棟 102教室</dd>
								</div>

								<div>
									<dt>頒布予定</dt>
									<dd>新刊</dd>
								</div>
							</dl>

							<a href="2026091700.html" class="text-link">
								詳細を見る
							</a>

						</div>

					</article>

				</div>

			</div>

		</section>


		<!-- =========================================
         過去のイベント
         ========================================= -->
		<section class="past-events">

			<div class="content-width">

				<div class="section-heading">
					<p class="section-label">PAST EVENTS</p>
					<h2>これまでの参加イベント</h2>
				</div>


				<div class="past-event-list">
				</div>

			</div>

		</section>


		<!-- =========================================
         イベントに関する案内
         ========================================= -->
		<section class="event-information">

			<div class="content-width">

				<div class="information-box">

					<div>

						<p>
							頒布物やスペースなど詳細情報をご確認のうえお越し下さい
						</p>
					</div>

					<a href="news.html" class="secondary-button">
						お知らせを見る
					</a>

				</div>

			</div>

		</section>

	</main>


	<!-- =========================================================
         フッター
         共通部分
         ========================================================= -->

	<footer class="site-footer">
	</footer>


	<script type="text/javascript" src="/website/js/common.js"></script>
</body>

</html>
